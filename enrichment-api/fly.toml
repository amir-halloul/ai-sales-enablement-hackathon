app = 'acme-enrichment-api'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  ZOOMINFO_ENABLED = 'true'
  DNB_ENABLED = 'false'
  ENRICHMENT_REQUEST_BUDGET_MS = '90000'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = '10s'
    interval = '60s'
    method = 'GET'
    path = '/hello'
    timeout = '5s'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
